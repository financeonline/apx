name: CI

# Gate order is fixed by TEST_STRATEGY.md §1:
#   typecheck → lint → unit → integration (Firebase emulators) → build → e2e:smoke
# Every gate is required on `main`. e2e:smoke arrives with Phase 7 (Playwright is not a Phase 1
# dependency); the job is present and skipped so the pipeline shape is already correct.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The integration suite (~100 files on the Firebase emulators, serial) takes about two hours on a
  # hosted runner and timed out there on its first run (2026-11-02). It runs weekly and on demand
  # (Actions → CI → Run workflow), not on every push; the fast gates run on every push.
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.14.0'

jobs:
  static:
    name: typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: lint
        run: npm run lint

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: unit tests with the coverage gate (IMPLEMENTATION_PLAN.md Phase 6 exit gate)
        run: npx vitest run --project unit --coverage

  database:
    name: integration (Firebase emulators)
    runs-on: ubuntu-latest
    needs: static
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # The Firestore and Storage emulators run on Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: "write local env for the emulators (demo-apx, which cannot reach Google)"
        run: bash scripts/write-local-env.sh
      # Hosted runners are several times slower than the owner's Mac: the emulator-heavy files need
      # longer than vitest's defaults (30 s per test, 60 s per hook).
      - name: integration tests (the src/db checks, a session per role, on the emulators)
        run: npx firebase emulators:exec --only auth,firestore,storage --project demo-apx "npx vitest run --project integration --testTimeout=180000 --hookTimeout=300000"

  build:
    name: production build
    runs-on: ubuntu-latest
    needs: [unit, security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: build-time-placeholder
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-apx

  security:
    name: security checks
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # SECURITY_MODEL.md §5. What this must catch is one IDENTIFIER of the form
      # `NEXT_PUBLIC_…SERVICE_ACCOUNT…`, so the wildcard is bounded to identifier characters: `.*`
      # would cross whitespace and match a line naming two SEPARATE variables, and a check that
      # cries wolf is a check people learn to ignore.
      - name: no secret may be exposed to the browser
        run: |
          if grep -rnE "NEXT_PUBLIC_[A-Za-z0-9_]*(SERVICE_ACCOUNT|SECRETS_KEY|ANTHROPIC|OPENAI|CRON_SECRET)" --include='*.ts' --include='*.tsx' --include='*.mjs' src/ 2>/dev/null; then
            echo "A secret is exposed with a NEXT_PUBLIC_ prefix (SECURITY_MODEL.md §5)."; exit 1
          fi
      - name: the Firebase service account is read in exactly one file (src/db/firestore.ts)
        run: |
          FILES=$(grep -rl "FIREBASE_SERVICE_ACCOUNT\|GOOGLE_APPLICATION_CREDENTIALS" --include='*.ts' src/ 2>/dev/null)
          echo "files reading the service account: $FILES"
          test "$FILES" = "src/db/firestore.ts"
      # Production dependencies: what ships. Dev tooling (the test runner, the Firebase CLI) is
      # audited by hand when it is upgraded, so an advisory in a test worker pool cannot block a release.
      - name: dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: e2e smoke (Phase 7)
    runs-on: ubuntu-latest
    needs: build
    if: false # Playwright journeys land with the dashboard in Phase 7 (TEST_STRATEGY.md §12).
    steps:
      - run: echo "not yet in scope"
